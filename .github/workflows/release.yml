name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v4.2.2, verified with git ls-remote on 2026-10-30.
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check security and manifest guards
        run: node tools/check-guards.mjs
      - name: Run Node test suite
        run: node --test dev/tests/*.test.mjs
      - name: Run Python release-package tests
        run: python3 -m unittest discover -s dev/tests -p 'test_*.py'
      - name: Verify tag and prepare release notes
        run: node tools/check-release-tag.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Build release ZIP and SHA-256 file
        run: python3 tools/make-release.py --output-dir dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/great-tab-killer-${GITHUB_REF_NAME}.zip" dist/SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
